[workspace]
members = [
  "crates/cowproof-core", "crates/cowproof-cli", "crates/cowproof-report", "crates/cowproof-plan", "crates/cowproof-host", "crates/cowproof-lint", "crates/cowproof-run", "crates/cowproof-prove",
  "crates/portkit/core", "crates/portkit/mcp", "crates/portkit/port", "crates/portkit/cli", "crates/portkit/plugin", "crates/portkit/read", "crates/portkit/index"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/srmcguirt/cowproof"
version = "0.1.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "io-std", "fs", "signal"] }

# The cowproof crates the `cowproof` package depends on. A path dependency needs a version
# for `cargo publish`; bump these together with `[workspace.package] version`.
cowproof-core = { version = "0.1.0", path = "crates/cowproof-core" }
cowproof-run = { version = "0.1.0", path = "crates/cowproof-run" }
cowproof-prove = { version = "0.1.0", path = "crates/cowproof-prove" }
cowproof-host = { version = "0.1.0", path = "crates/cowproof-host" }
cowproof-plan = { version = "0.1.0", path = "crates/cowproof-plan" }
cowproof-lint = { version = "0.1.0", path = "crates/cowproof-lint" }
cowproof-report = { version = "0.1.0", path = "crates/cowproof-report" }

# Portkit workspace dependencies
portkit-core = { version = "0.1.0", path = "crates/portkit/core" }
portkit-mcp = { version = "0.1.0", path = "crates/portkit/mcp" }
portkit-port = { version = "0.1.0", path = "crates/portkit/port" }
portkit-cli = { version = "0.1.0", path = "crates/portkit/cli" }
portkit-index = { version = "0.1.0", path = "crates/portkit/index" }
portkit-plugin = { version = "0.1.0", path = "crates/portkit/plugin" }
portkit-read = { version = "0.1.0", path = "crates/portkit/read" }

thiserror = "2"
jsonschema = { version = "0.55", default-features = false }
async-trait = "0.1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap_complete = "4"
config = { version = "0.15", default-features = false, features = ["toml"] }
time = { version = "0.3", features = ["formatting", "macros"] }
regex = "1"

assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "0.8"

# Lints every member opts into with `[lints] workspace = true`. Each one is at zero today and
# catches something an agent leaves behind or a reviewer misses; CI's `-D warnings` makes
# a `warn` here fail too. Raise a lint here only once the workspace is clean of it.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Left-behind scaffolding.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A silenced lint says why, so a reviewer can judge it.
allow_attributes_without_reason = "deny"
# Every unsafe block names the invariant it relies on, one operation at a time.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "deny"
# Small slips that read as correct.
lossy_float_literal = "deny"
suspicious_xor_used_as_pow = "deny"
try_err = "deny"
empty_drop = "deny"
large_include_file = "deny"
