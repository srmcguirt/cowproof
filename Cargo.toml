[workspace]
members = ["crates/cowproof-core", "crates/cowproof-cli", "crates/cowproof-report", "crates/cowproof-plan", "crates/cowproof-host", "crates/cowproof-lint"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "fs", "signal"] }
