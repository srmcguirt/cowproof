[package]
name = "cowproof"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run many AI builders in parallel on one project, each in its own copy-on-write clone and OS sandbox, and let nothing land until it is proven."
readme = "../../README.md"
keywords = ["ai", "agents", "sandbox", "verification", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cowproof_cli"
path = "src/lib.rs"

[[bin]]
name = "cowproof"
path = "src/main.rs"

[[bin]]
name = "pk"
path = "src/bin/pk.rs"

[[bin]]
name = "pk-read"
path = "src/bin/pk-read.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
cowproof-core.workspace = true
cowproof-host.workspace = true
cowproof-plan.workspace = true
cowproof-lint.workspace = true
cowproof-run.workspace = true
cowproof-prove.workspace = true
cowproof-report.workspace = true
portkit-core.workspace = true
portkit-cli.workspace = true
portkit-mcp.workspace = true
portkit-plugin.workspace = true
portkit-port.workspace = true
portkit-read.workspace = true
tempfile.workspace = true

[dev-dependencies]
sha2.workspace = true
libc = "0.2"

[lints]
workspace = true
