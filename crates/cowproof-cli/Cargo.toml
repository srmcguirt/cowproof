[package]
name = "cowproof-cli"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cowproof_cli"
path = "src/lib.rs"

[[bin]]
name = "cowproof"
path = "src/main.rs"

[[bin]]
name = "pk"
path = "src/bin/pk.rs"

[[bin]]
name = "pk-read"
path = "src/bin/pk-read.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
cowproof-core = { path = "../cowproof-core" }
cowproof-host = { path = "../cowproof-host" }
cowproof-plan = { path = "../cowproof-plan" }
cowproof-lint = { path = "../cowproof-lint" }
cowproof-run = { path = "../cowproof-run" }
cowproof-prove = { path = "../cowproof-prove" }
cowproof-report = { path = "../cowproof-report" }
portkit-core.workspace = true
portkit-cli.workspace = true
portkit-mcp.workspace = true
portkit-plugin.workspace = true
portkit-read.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
