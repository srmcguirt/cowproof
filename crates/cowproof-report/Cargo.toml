[package]
name = "cowproof-report"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cowproof_report"
path = "src/lib.rs"

[[bin]]
name = "cowproof-report"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cowproof-core = { version = "0.1.0", path = "../cowproof-core" }
cowproof-prove = { version = "0.1.0", path = "../cowproof-prove" }
portkit-core = { version = "0.1.0", path = "../portkit/core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
