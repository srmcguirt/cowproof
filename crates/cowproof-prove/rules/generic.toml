# Generic flaw rules: gaming patterns that apply to any stack. This is the one copy of the
# pack. It is embedded in `cowproof-prove` and loads first, always, in the proof gates and in
# `cowproof report handback`: a repository needs no file for it. Rules tied to one stack or
# project (Postgres policies, Supabase migrations, one codebase's naming) live in other packs
# (`example-supabase` ships built in) that load only when asked for: `packs = [...]` under
# `[proof]` in `cowproof.toml`, or `--pack` on the report.

[[rules]]
pattern = "(?i)EXCEPTION\\s+WHEN\\s+OTHERS"
files = ["**/*"]
explanation = "This catches and can swallow every exception."

[[rules]]
pattern = "#\\[ignore\\]"
files = ["**/*.rs"]
explanation = "An ignored Rust test may hide a failing check."
added_only = true

[[rules]]
pattern = "(?i)\\binnerHTML\\b|createContextualFragment|insertAdjacentHTML"
files = ["**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.html"]
explanation = "String based HTML rendering can introduce injection risk."

[[rules]]
pattern = ".*"
files = ["**/*"]
explanation = "A migration at or before the supplied baseline was changed."
applied_migration = true

[[rules]]
pattern = "(?i)(postmaster\\.pid|pg_wal/|(^|/)target/|(^|/)tmp-[^/]+)"
files = ["**/*"]
explanation = "Build output or scratch files appear in the patch."
path_only = true
