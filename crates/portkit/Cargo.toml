[package]
name = "portkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cli", "mcp", "agent", "template", "porting"]
categories = ["command-line-utilities", "development-tools"]
description = """
Reference binary for portkit: a template for porting tested Python agentic \
processes to Rust tooling that is usable as a CLI, an MCP server, and a \
library — with a golden-fixture parity harness to prove the port is faithful.
"""

[[bin]]
name = "pk"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["core", "mcp", "port", "cli", "demo", "index", "schema", "plugin", "read"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Shane McGuirt <srmcguirt@gmail.com>"]
repository = "https://github.com/srmcguirt/portkit"
rust-version = "1.90"

[workspace.dependencies]
portkit-core = { version = "0.1.0", path = "core" }
portkit-mcp  = { version = "0.1.0", path = "mcp" }
portkit-port = { version = "0.1.0", path = "port" }
portkit-cli  = { version = "0.1.0", path = "cli" }
portkit-demo = { version = "0.1.0", path = "demo" }
portkit-index = { version = "0.1.0", path = "index" }
portkit-schema = { version = "0.1.0", path = "schema", default-features = false }
portkit-plugin = { version = "0.1.0", path = "plugin" }
portkit-read = { version = "0.1.0", path = "read" }

thiserror = "2"
jsonschema = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
config = { version = "0.15", default-features = false, features = ["toml"] }
time = { version = "0.3", features = ["formatting", "macros"] }

assert_cmd = "2"
predicates = "3"
tempfile = "3"

[dependencies]
portkit-cli.workspace = true
portkit-demo.workspace = true
portkit-schema.workspace = true
portkit-plugin.workspace = true
portkit-index.workspace = true
portkit-core.workspace = true
tokio.workspace = true

[dev-dependencies]
portkit-port.workspace = true
tokio.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
