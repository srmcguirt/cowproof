[package]
name = "portkit-plugin"
description = "Subprocess plugins for portkit: any executable that describes itself can be registered as a tool."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[dependencies]
portkit-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "macros"] }
tracing.workspace = true
toml = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
