[package]
name = "portkit-index"
description = "PROTOTYPE: persistent symbol index to test whether a warm resident service beats grep on both latency and payload."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
publish = false

[lib]
name = "portkit_index"
path = "src/lib.rs"

[dependencies]
portkit-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ignore = "0.4"
memchr = "2"
ast-grep-core = "0.45"
ast-grep-language = "0.45"
