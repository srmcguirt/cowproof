[package]
name = "portkit-read"
description = "Session-aware file reader: returns only what the caller does not already have."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[[bin]]
name = "pk-read"
path = "src/main.rs"

[lib]
name = "portkit_read"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
time.workspace = true
blake3 = "1"

[dev-dependencies]
tempfile.workspace = true
