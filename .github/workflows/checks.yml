name: Checks

# The security and slop gate, beside ci.yml (build, test, MSRV). Jobs named "gate" fail the run;
# steps marked `continue-on-error` print a report without blocking anyone. Tighten a step by
# deleting its `continue-on-error` once its backlog is zero.
#
# Semgrep and gitleaks look only at what the change adds, so an agent is told about the slop and
# the leaks it introduced, not the ones it inherited. cargo-deny and the workflow linters check
# everything, because a vulnerable dependency or a weak workflow is a problem whoever added it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New RustSec advisories land against code that has not changed.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The commit the change is measured against; on main, the previous commit.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  workflows:
    name: gate / workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: actionlint
        run: |
          curl -sSL -o /tmp/al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint
      - name: zizmor
        run: uvx zizmor@1.31.1 --offline .github/workflows

  secrets:
    name: gate / secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # .gitleaks.toml allows the redactor's fake keys and nothing else.
      - name: gitleaks on this change's commits
        run: |
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            range="$BASE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          /tmp/gitleaks git --no-banner --redact --log-opts="$range" .
      - name: gitleaks on the whole tree
        run: /tmp/gitleaks dir --no-banner --redact .

  semgrep:
    name: gate / semgrep (new findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Registry packs: fail only on NEW findings at ERROR severity.
      - name: registry rules, new ERROR findings
        if: github.event_name == 'pull_request'
        run: >-
          uvx semgrep@1.182.1 scan --metrics=off --error --severity ERROR
          --baseline-commit "$BASE_SHA"
          --config p/default --config p/rust --config p/secrets --config p/github-actions
      # Project rules (.semgrep/cowproof.yml): fail on any NEW WARNING or ERROR.
      - name: project rules, new findings
        if: github.event_name == 'pull_request'
        run: >-
          uvx semgrep@1.182.1 scan --metrics=off --error --severity WARNING --severity ERROR
          --baseline-commit "$BASE_SHA" --config .semgrep/
      # Project ERROR rules are at zero on main, so they hold everywhere, not just in a diff.
      - name: project ERROR rules, whole tree
        run: >-
          uvx semgrep@1.182.1 scan --metrics=off --error --severity ERROR --config .semgrep/
      - name: full report (does not fail)
        continue-on-error: true
        run: >-
          uvx semgrep@1.182.1 scan --metrics=off
          --config p/default --config p/rust --config p/secrets --config p/github-actions
          --config .semgrep/

  deps:
    name: gate / dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-machete
      # Advisories (vulnerable, unsound and unmaintained crates), licences, bans and sources.
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo machete (report unused dependencies)
        continue-on-error: true
        run: cargo machete

  shell:
    name: gate / shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The plugin hook runs on every user's machine; the scripts run in CI and before a push.
      # Fixtures are test input (some hostile on purpose) and are left as they are.
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' 'scripts/*' 'plugin/scripts/*' ':!:fixtures/' ':!:**/fixtures/**' \
            | xargs -0 shellcheck -S warning
